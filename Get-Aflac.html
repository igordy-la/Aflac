<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0798dc">
<meta name="description" content="Explore supplemental coverage options with Nelli Gordon. Call or email to talk about your coverage.">
<title>Got Aflac? | Nelli Gordon</title>
<style>
:root {
  --site-primary: #0798dc;
  --site-secondary: #e5f4ff;
  --site-background: #f7fcff;
  --site-on-primary: #ffffff;
  --site-on-secondary: #073b78;
  --site-on-background: #073b78;
  --site-font-body: Arial, Helvetica, sans-serif;
  --site-font-heading: Arial, Helvetica, sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; font-family: var(--site-font-body); background: light-dark(var(--site-background), #10202c); color: light-dark(var(--site-on-background), #f2f8ff); }
.app { min-height: 100vh; width: 100%; border-radius: 0; background: light-dark(var(--site-background), #10202c); }
main { width: min(100%, 760px); margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }
 .flyer-wrap { position: relative; width: 100%; }
.flyer { display: block; width: 100%; height: auto; border-radius: calc(18px * var(--site-radius-scale)); box-shadow: 0 10px 35px rgb(0 75 130 / 12%); }
 .flyer-wrap { position: relative; width: 100%; }
.flyer { display: block; width: 100%; height: auto; border-radius: calc(18px * var(--site-radius-scale)); box-shadow: 0 10px 35px rgb(0 75 130 / 12%); }
.flyer-action {
  position: absolute;
  top: 48%;
  width: 25%;
  height: 6.5%;
  min-height: 48px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 10px;
  border: 2px solid #0798dc;
  border-radius: 10px;
  background: #0798dc;
  color: #fff;
  text-decoration: none;
  font-size: clamp(14px, 2.2vw, 17px);
  line-height: 1.15;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
  box-shadow: 0 2px 5px rgb(0 65 120 / 18%);
  transition: transform .15s ease, filter .15s ease;
}
.flyer-action.phone { left: 42%; }
.flyer-action.email { left: 69%; }
.contact-detail {
  position: absolute;
  left: 42%;
  width: 52%;
  color: #073b78;
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(14px, 2.8vw, 22px);
  line-height: 1.45;
  font-weight: 700;
  text-align: center;
  overflow-wrap: anywhere;
  letter-spacing: normal;
  text-shadow: none;
}
.phone-detail { top: 56.5%; }
.email-detail { top: 59.3%; }

.flyer-action .icon {
  width: 19px;
  height: 19px;
  flex: 0 0 auto;
  margin: 0;
}
.flyer-action .label {
  display: block;
  line-height: 1.15;
}
.flyer-action:focus-visible { outline: 3px solid #073b78; outline-offset: 3px; }
.flyer-action:active { transform: scale(.985); filter: brightness(.96); }
@media (max-width: 420px) {
  .flyer-action {
    gap: 5px;
    padding: 5px 6px;
    border-radius: 8px;
    font-size: 11px;
    height: 6.5%;
    min-height: 38px;
  }
  .flyer-action .icon { width: 15px; height: 15px; }
  .contact-detail {
  position: absolute;
  left: 42%;
  width: 52%;
  color: #073b78;
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(14px, 2.8vw, 22px);
  line-height: 1.45;
  font-weight: 700;
  text-align: center;
  overflow-wrap: anywhere;
  letter-spacing: normal;
  text-shadow: none;
}
.phone-detail { top: 56.5%; }
.email-detail { top: 59.3%; }
.contact { margin: 18px 0 0; padding: calc(22px * var(--site-spacing-scale)); border-radius: calc(24px * var(--site-radius-scale)); background: light-dark(#e7f5ff, #17364c); border: 1px solid light-dark(#cceaff, #2b5874); }
h1 { font-family: var(--site-font-heading); font-size: calc(1.65rem * var(--site-heading-scale)); line-height: 1.15; margin: 0 0 8px; color: light-dark(#073b78, #eaf6ff); }
.intro { margin: 0 0 18px; line-height: 1.5; color: light-dark(#234e79, #d4e9f7); }
.actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; max-width: 420px; margin: 0 auto; }
.action { min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 16px; border-radius: calc(14px * var(--site-radius-scale)); background: var(--site-primary); color: var(--site-on-primary); text-decoration: none; font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; text-align: center; box-shadow: 0 4px 0 rgb(0 65 120 / 10%); transition: transform .15s ease, filter .15s ease; }
.action.secondary { background: light-dark(#ffffff, #10202c); color: light-dark(#07508a, #e8f6ff); border: 2px solid var(--site-primary); box-shadow: none; }
.action:focus-visible { outline: 3px solid light-dark(#073b78, #ffffff); outline-offset: 3px; }
.action:active { transform: scale(.985); filter: brightness(.96); }
.icon { width: 23px; height: 23px; flex: 0 0 auto; }
footer { text-align: center; font-size: .8rem; line-height: 1.5; margin: 16px auto 0; padding: 0 8px; color: light-dark(#55718a, #adc6d8); }
@media (min-width: 540px) { main { padding: 24px 22px 36px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
